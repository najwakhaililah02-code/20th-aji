<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20th — Aji</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <canvas id="canvas"></canvas>

    <main class="content">
        <p id="eyebrow">A LITTLE BIRTHDAY SURPRISE</p>

        <h1 id="mainText">something special is coming</h1>

        <p id="subtitle">made with a little love ♡</p>




        <div id="heartMessage">
            may your day be filled with<br>
            happiness, laughter, and love.
        </div>

        <div id="dedication">
            <span>for</span>
            <strong>JJ my fav man</strong>
        </div>


        <div id="finalMessage">
            <div id="typedMessage"></div>
            <p id="signature">-with love, awa-</p>
            <button id="finishButton">finish this little surprise ♡</button>
        </div>


        <div id="endingMessage">
            <p>and that's a wrap ♡</p>
            <h2>happy birthday, JJ.</h2>
            <span>always wishing the best for you.</span>
        </div>



        <button id="startButton">open your surprise ♡</button>


        <audio id="music" src="music.mp3" loop preload="auto"></audio>

        <script src="script.js"></script>
</body>

</html>
